[project]
name = "sci-comm"
version = "0.1.0"
description = "Scientific communication kit using Manim and Manim Slides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.19,<0.22",
    "manim-slides[manim]==5.6.0",
]

[dependency-groups]
dev = [
    "manim-slides[pyside6]==5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
